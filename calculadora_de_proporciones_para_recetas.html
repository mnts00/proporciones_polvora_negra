<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Proporciones de Recetas (S, C, N)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        input[type=range] { accent-color: #6366f1; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-full flex flex-col justify-between p-4 md:p-8 max-w-6xl mx-auto">

    <!-- Header Section -->
    <header class="text-center my-6">
        <div class="inline-flex items-center justify-center p-3 bg-indigo-600/20 text-indigo-400 rounded-2xl mb-3 border border-indigo-500/30">
            <i class="fa-solid fa-scale-balanced text-3xl"></i>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2">Calculadora de Proporciones</h1>
        <p class="text-slate-400 text-sm md:text-base max-w-lg mx-auto">
            Calcula la masa en gramos para <span class="text-amber-400 font-semibold">S</span>, <span class="text-emerald-400 font-semibold">C</span> y <span class="text-cyan-400 font-semibold">N</span>, y guarda tus variaciones con comentarios personalizados.
        </p>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 my-auto">

        <!-- Left Column: Controls (Total & Percentages & Gram Results) -->
        <section class="lg:col-span-6 bg-slate-800/80 backdrop-blur-md p-6 rounded-3xl border border-slate-700/60 shadow-xl flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-bold text-white mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-sliders text-indigo-400 mr-2"></i>Calculadora Activa</span>
                    <button id="btnEqualize" class="text-xs bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-xl transition-all">
                        <i class="fa-solid fa-arrows-split-up-and-left mr-1"></i> Igualar 100%
                    </button>
                </h2>

                <!-- Peso Total Input -->
                <div class="mb-6">
                    <label for="totalWeight" class="block text-sm font-semibold text-slate-300 mb-2 flex items-center justify-between">
                        <span><i class="fa-solid fa-weight-hanging text-indigo-400 mr-2"></i>Peso Total de la Mezcla</span>
                        <span class="text-xs text-slate-400 font-normal">Gramos (g)</span>
                    </label>
                    <div class="relative">
                        <input type="number" id="totalWeight" min="0" step="any" value="1000"
                            class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-2xl font-bold rounded-2xl py-3 px-4 text-white outline-none transition-all">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">g</span>
                    </div>
                </div>

                <!-- Total Percentage Status Indicator -->
                <div class="mb-6 p-3.5 rounded-2xl flex items-center justify-between border transition-all" id="statusBox">
                    <div class="flex items-center space-x-2">
                        <i id="statusIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
                        <span id="statusText" class="text-sm font-semibold">Suma de Porcentajes:</span>
                    </div>
                    <span id="totalPercentageDisplay" class="text-lg font-extrabold">100%</span>
                </div>

                <!-- Ingredients Controls -->
                <div class="space-y-4">
                    <!-- Ingrediente S -->
                    <div class="p-4 bg-slate-900/60 rounded-2xl border border-slate-800">
                        <div class="flex justify-between items-center mb-2">
                            <label class="font-bold text-amber-400 flex items-center gap-2">
                                <span class="w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs font-black border border-amber-500/30">S</span>
                                Ingrediente S
                            </label>
                            <div class="flex items-center gap-3">
                                <span id="gramResultS" class="font-extrabold text-amber-400 text-lg">400.0g</span>
                                <div class="flex items-center gap-1 bg-slate-800 px-2.5 py-1 rounded-xl border border-slate-700">
                                    <input type="number" id="inputS" min="0" max="100" step="0.1" value="40"
                                        class="w-14 bg-transparent text-right font-bold text-amber-400 outline-none">
                                    <span class="text-slate-400 text-xs font-semibold">%</span>
                                </div>
                            </div>
                        </div>
                        <input type="range" id="sliderS" min="0" max="100" step="0.1" value="40"
                            class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500">
                    </div>

                    <!-- Ingrediente C -->
                    <div class="p-4 bg-slate-900/60 rounded-2xl border border-slate-800">
                        <div class="flex justify-between items-center mb-2">
                            <label class="font-bold text-emerald-400 flex items-center gap-2">
                                <span class="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-black border border-emerald-500/30">C</span>
                                Ingrediente C
                            </label>
                            <div class="flex items-center gap-3">
                                <span id="gramResultC" class="font-extrabold text-emerald-400 text-lg">350.0g</span>
                                <div class="flex items-center gap-1 bg-slate-800 px-2.5 py-1 rounded-xl border border-slate-700">
                                    <input type="number" id="inputC" min="0" max="100" step="0.1" value="35"
                                        class="w-14 bg-transparent text-right font-bold text-emerald-400 outline-none">
                                    <span class="text-slate-400 text-xs font-semibold">%</span>
                                </div>
                            </div>
                        </div>
                        <input type="range" id="sliderC" min="0" max="100" step="0.1" value="35"
                            class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                    </div>

                    <!-- Ingrediente N -->
                    <div class="p-4 bg-slate-900/60 rounded-2xl border border-slate-800">
                        <div class="flex justify-between items-center mb-2">
                            <label class="font-bold text-cyan-400 flex items-center gap-2">
                                <span class="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-black border border-cyan-500/30">N</span>
                                Ingrediente N
                            </label>
                            <div class="flex items-center gap-3">
                                <span id="gramResultN" class="font-extrabold text-cyan-400 text-lg">250.0g</span>
                                <div class="flex items-center gap-1 bg-slate-800 px-2.5 py-1 rounded-xl border border-slate-700">
                                    <input type="number" id="inputN" min="0" max="100" step="0.1" value="25"
                                        class="w-14 bg-transparent text-right font-bold text-cyan-400 outline-none">
                                    <span class="text-slate-400 text-xs font-semibold">%</span>
                                </div>
                            </div>
                        </div>
                        <input type="range" id="sliderN" min="0" max="100" step="0.1" value="25"
                            class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                    </div>
                </div>

                <!-- Visual Progress Bar -->
                <div class="mt-5">
                    <div class="h-3 w-full bg-slate-900 rounded-full overflow-hidden flex border border-slate-700/50 p-0.5">
                        <div id="barS" class="bg-amber-500 h-full rounded-l-full transition-all duration-300" style="width: 40%"></div>
                        <div id="barC" class="bg-emerald-500 h-full transition-all duration-300" style="width: 35%"></div>
                        <div id="barN" class="bg-cyan-500 h-full rounded-r-full transition-all duration-300" style="width: 25%"></div>
                    </div>
                </div>

                <!-- Comment & Save Box -->
                <div class="mt-6 pt-5 border-t border-slate-700/60">
                    <label for="recipeComment" class="block text-xs font-semibold text-slate-400 mb-2">
                        <i class="fa-solid fa-comment-dots text-indigo-400 mr-1"></i> Nota o Comentario para Guardar
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="recipeComment" placeholder="Ej: Lote 1 - Masa Pizza, Súper Sabor..."
                            class="flex-1 bg-slate-900 border border-slate-700 focus:border-indigo-500 text-sm rounded-xl py-2.5 px-3 text-white outline-none transition-all placeholder:text-slate-600">
                        <button id="btnSave" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold text-xs md:text-sm px-4 rounded-xl transition-all flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                            <i class="fa-solid fa-bookmark"></i> Guardar
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Column: Saved Recipes / History -->
        <section class="lg:col-span-6 bg-slate-800/80 backdrop-blur-md p-6 rounded-3xl border border-slate-700/60 shadow-xl flex flex-col justify-between h-[650px]">
            <div class="flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-box-archive text-indigo-400"></i> Recetas Guardadas
                        <span id="savedCount" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full font-semibold">0</span>
                    </h2>
                </div>

                <!-- Search Input -->
                <div class="relative mb-4">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por comentario o nota..."
                        class="w-full bg-slate-900/80 border border-slate-700/80 focus:border-indigo-500 text-xs rounded-xl py-2 pl-9 pr-3 text-white outline-none transition-all placeholder:text-slate-500">
                </div>

                <!-- Saved List Container -->
                <div id="savedList" class="space-y-3 overflow-y-auto custom-scrollbar flex-1 pr-1">
                    <!-- Dynamic Items render here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal for Editing Comments and Recipe Data -->
    <div id="editModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-400"></i> Editar Guardado
            </h3>

            <input type="hidden" id="editRecipeId">

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Comentario / Nombre</label>
                <input type="text" id="editComment" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 text-sm text-white outline-none focus:border-indigo-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Peso Total (g)</label>
                    <input type="number" id="editWeight" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 text-sm text-white outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-400 mb-1">Ingrediente S (%)</label>
                    <input type="number" id="editPctS" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 text-sm text-amber-400 font-bold outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-emerald-400 mb-1">Ingrediente C (%)</label>
                    <input type="number" id="editPctC" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 text-sm text-emerald-400 font-bold outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 mb-1">Ingrediente N (%)</label>
                    <input type="number" id="editPctN" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 text-sm text-cyan-400 font-bold outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button id="btnCancelEdit" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-xl text-slate-200">Cancelar</button>
                <button id="btnSaveEdit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-xl text-white">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 mt-8">
        Calculadora de Recetas &copy; <span id="year"></span> | S, C, N
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // UI Controls
        const totalWeightInput = document.getElementById('totalWeight');
        const sliderS = document.getElementById('sliderS');
        const inputS = document.getElementById('inputS');
        const gramResultS = document.getElementById('gramResultS');
        const barS = document.getElementById('barS');

        const sliderC = document.getElementById('sliderC');
        const inputC = document.getElementById('inputC');
        const gramResultC = document.getElementById('gramResultC');
        const barC = document.getElementById('barC');

        const sliderN = document.getElementById('sliderN');
        const inputN = document.getElementById('inputN');
        const gramResultN = document.getElementById('gramResultN');
        const barN = document.getElementById('barN');

        const statusBox = document.getElementById('statusBox');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const totalPercentageDisplay = document.getElementById('totalPercentageDisplay');

        const btnEqualize = document.getElementById('btnEqualize');
        const btnSave = document.getElementById('btnSave');
        const recipeCommentInput = document.getElementById('recipeComment');
        const savedList = document.getElementById('savedList');
        const savedCount = document.getElementById('savedCount');
        const searchInput = document.getElementById('searchInput');

        // Modal Controls
        const editModal = document.getElementById('editModal');
        const editRecipeId = document.getElementById('editRecipeId');
        const editComment = document.getElementById('editComment');
        const editWeight = document.getElementById('editWeight');
        const editPctS = document.getElementById('editPctS');
        const editPctC = document.getElementById('editPctC');
        const editPctN = document.getElementById('editPctN');
        const btnCancelEdit = document.getElementById('btnCancelEdit');
        const btnSaveEdit = document.getElementById('btnSaveEdit');

        let savedRecipes = [];

        // Load recipes from LocalStorage
        function loadSavedRecipes() {
            const data = localStorage.getItem('recipes_history_scn');
            savedRecipes = data ? JSON.parse(data) : [];
            renderSavedList();
        }

        // Save recipes to LocalStorage
        function saveRecipesToStorage() {
            localStorage.setItem('recipes_history_scn', JSON.stringify(savedRecipes));
            renderSavedList();
        }

        // Calculation & Active UI Update
        function updateCalculations() {
            const valS = parseFloat(inputS.value) || 0;
            const valC = parseFloat(inputC.value) || 0;
            const valN = parseFloat(inputN.value) || 0;
            const totalWeight = parseFloat(totalWeightInput.value) || 0;

            const sumPct = valS + valC + valN;
            const roundedSum = Math.round(sumPct * 100) / 100;

            // Grams Calculation
            const gramsS = (totalWeight * valS) / 100;
            const gramsC = (totalWeight * valC) / 100;
            const gramsN = (totalWeight * valN) / 100;

            gramResultS.textContent = `${gramsS.toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}g`;
            gramResultC.textContent = `${gramsC.toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}g`;
            gramResultN.textContent = `${gramsN.toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}g`;

            // Progress Bar
            const displaySum = roundedSum > 0 ? roundedSum : 1;
            barS.style.width = `${(valS / displaySum) * 100}%`;
            barC.style.width = `${(valC / displaySum) * 100}%`;
            barN.style.width = `${(valN / displaySum) * 100}%`;

            // Status Indicator
            totalPercentageDisplay.textContent = `${roundedSum}%`;

            if (Math.abs(roundedSum - 100) < 0.1) {
                statusBox.className = "mb-6 p-3.5 rounded-2xl flex items-center justify-between border bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
                statusIcon.className = "fa-solid fa-circle-check text-emerald-400";
                statusText.textContent = "Suma correcta (100%)";
            } else if (roundedSum < 100) {
                statusBox.className = "mb-6 p-3.5 rounded-2xl flex items-center justify-between border bg-amber-500/10 border-amber-500/30 text-amber-400";
                statusIcon.className = "fa-solid fa-triangle-exclamation text-amber-400";
                statusText.textContent = `Falta un ${(100 - roundedSum).toFixed(1)}%`;
            } else {
                statusBox.className = "mb-6 p-3.5 rounded-2xl flex items-center justify-between border bg-rose-500/10 border-rose-500/30 text-rose-400";
                statusIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
                statusText.textContent = `Exceso de ${(roundedSum - 100).toFixed(1)}%`;
            }
        }

        // Sync Sliders & Text Inputs
        function bindPair(slider, input) {
            slider.addEventListener('input', () => {
                input.value = slider.value;
                updateCalculations();
            });

            input.addEventListener('input', () => {
                let val = parseFloat(input.value);
                if (isNaN(val)) val = 0;
                slider.value = val;
                updateCalculations();
            });
        }

        bindPair(sliderS, inputS);
        bindPair(sliderC, inputC);
        bindPair(sliderN, inputN);
        totalWeightInput.addEventListener('input', updateCalculations);

        // Auto Equalize to 100%
        btnEqualize.addEventListener('click', () => {
            let valS = parseFloat(inputS.value) || 0;
            let valC = parseFloat(inputC.value) || 0;
            let valN = parseFloat(inputN.value) || 0;
            let total = valS + valC + valN;

            if (total === 0) {
                valS = 33.33; valC = 33.33; valN = 33.34;
            } else {
                valS = Math.round((valS / total) * 1000) / 10;
                valC = Math.round((valC / total) * 1000) / 10;
                valN = Math.round((100 - valS - valC) * 10) / 10;
            }

            inputS.value = sliderS.value = valS;
            inputC.value = sliderC.value = valC;
            inputN.value = sliderN.value = valN;

            updateCalculations();
        });

        // Save Current Recipe
        btnSave.addEventListener('click', () => {
            const comment = recipeCommentInput.value.trim() || `Receta ${new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'})}`;
            const totalWeight = parseFloat(totalWeightInput.value) || 1000;
            const pctS = parseFloat(inputS.value) || 0;
            const pctC = parseFloat(inputC.value) || 0;
            const pctN = parseFloat(inputN.value) || 0;

            const gramsS = (totalWeight * pctS) / 100;
            const gramsC = (totalWeight * pctC) / 100;
            const gramsN = (totalWeight * pctN) / 100;

            const recipe = {
                id: Date.now().toString(),
                date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
                comment,
                totalWeight,
                pctS, pctC, pctN,
                gramsS, gramsC, gramsN
            };

            savedRecipes.unshift(recipe);
            saveRecipesToStorage();
            recipeCommentInput.value = '';
        });

        // Load Recipe into Active Calculator
        window.loadRecipeIntoCalc = function(id) {
            const recipe = savedRecipes.find(r => r.id === id);
            if (!recipe) return;

            totalWeightInput.value = recipe.totalWeight;
            inputS.value = sliderS.value = recipe.pctS;
            inputC.value = sliderC.value = recipe.pctC;
            inputN.value = sliderN.value = recipe.pctN;

            updateCalculations();
        };

        // Delete Saved Recipe
        window.deleteRecipe = function(id) {
            savedRecipes = savedRecipes.filter(r => r.id !== id);
            saveRecipesToStorage();
        };

        // Open Edit Modal
        window.openEditModal = function(id) {
            const recipe = savedRecipes.find(r => r.id === id);
            if (!recipe) return;

            editRecipeId.value = recipe.id;
            editComment.value = recipe.comment;
            editWeight.value = recipe.totalWeight;
            editPctS.value = recipe.pctS;
            editPctC.value = recipe.pctC;
            editPctN.value = recipe.pctN;

            editModal.classList.remove('hidden');
        };

        btnCancelEdit.addEventListener('click', () => {
            editModal.classList.add('hidden');
        });

        btnSaveEdit.addEventListener('click', () => {
            const id = editRecipeId.value;
            const index = savedRecipes.findIndex(r => r.id === id);
            if (index === -1) return;

            const totalWeight = parseFloat(editWeight.value) || 0;
            const pctS = parseFloat(editPctS.value) || 0;
            const pctC = parseFloat(editPctC.value) || 0;
            const pctN = parseFloat(editPctN.value) || 0;

            savedRecipes[index] = {
                ...savedRecipes[index],
                comment: editComment.value.trim() || 'Sin comentario',
                totalWeight,
                pctS, pctC, pctN,
                gramsS: (totalWeight * pctS) / 100,
                gramsC: (totalWeight * pctC) / 100,
                gramsN: (totalWeight * pctN) / 100
            };

            saveRecipesToStorage();
            editModal.classList.add('hidden');
        });

        // Render Saved List
        function renderSavedList() {
            const filter = searchInput.value.toLowerCase();
            const filtered = savedRecipes.filter(r => r.comment.toLowerCase().includes(filter));

            savedCount.textContent = savedRecipes.length;

            if (filtered.length === 0) {
                savedList.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i>
                        <span class="text-sm">No hay recetas guardadas</span>
                    </div>
                `;
                return;
            }

            savedList.innerHTML = filtered.map(r => `
                <div class="p-4 bg-slate-900/70 border border-slate-800 hover:border-slate-700 rounded-2xl transition-all space-y-3">
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <h4 class="font-bold text-white text-sm line-clamp-1">${escapeHtml(r.comment)}</h4>
                            <span class="text-[10px] text-slate-500">${r.date} • Total: <strong class="text-slate-300">${r.totalWeight}g</strong></span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="loadRecipeIntoCalc('${r.id}')" title="Cargar en la calculadora" class="p-1.5 text-indigo-400 hover:bg-indigo-500/20 rounded-lg transition-all text-xs">
                                <i class="fa-solid fa-arrow-left-long"></i>
                            </button>
                            <button onclick="openEditModal('${r.id}')" title="Editar registro" class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all text-xs">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteRecipe('${r.id}')" title="Eliminar registro" class="p-1.5 text-rose-400 hover:bg-rose-500/20 rounded-lg transition-all text-xs">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="bg-amber-500/10 border border-amber-500/20 py-1.5 px-1 rounded-xl">
                            <span class="block text-amber-400 font-extrabold">S: ${r.pctS}%</span>
                            <span class="text-[11px] text-slate-400">${r.gramsS.toFixed(1)}g</span>
                        </div>
                        <div class="bg-emerald-500/10 border border-emerald-500/20 py-1.5 px-1 rounded-xl">
                            <span class="block text-emerald-400 font-extrabold">C: ${r.pctC}%</span>
                            <span class="text-[11px] text-slate-400">${r.gramsC.toFixed(1)}g</span>
                        </div>
                        <div class="bg-cyan-500/10 border border-cyan-500/20 py-1.5 px-1 rounded-xl">
                            <span class="block text-cyan-400 font-extrabold">N: ${r.pctN}%</span>
                            <span class="text-[11px] text-slate-400">${r.gramsN.toFixed(1)}g</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', renderSavedList);

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        // Initialize App
        loadSavedRecipes();
        updateCalculations();
    </script>
</body>
</html>
